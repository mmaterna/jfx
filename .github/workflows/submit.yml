#
# This GitHub actions YAML file runs a build and test on each of the three primary platforms:
# Linux, macOS (both x64 and aarch64), Windows. The jobs are run using the default (latest) OS platform for each OS.
# We download a specific version the boot JDK and gradle. We use the default versions
# of all other build tools (e.g., compilers and ant) that are available on each platform.
#
# The build step is run in the default mode without building the native media or webkit libraries.
# The test is run with web tests excluded. As a follow-up enhancement, we might consider optionally
# building the media and webkit libraries.
#
# NOTE: much of the build logic is duplicated for each platform. Keep this in mind when making changes.
#

name: JavaFX pre-submit tests

on:
  # Run GitHub actions on every push to all branches except the main production branches, also
  # exclude any branch starting with "WIP".
  push:
    branches-ignore:
      - master
      - main
      - 'jfx[0-9]+'
      - 'WIP*'
    tags:
      - '*-devmate*'
  # Enable triggering the workflow manually
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Required for publishing to GitHub Packages

jobs:
  validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4


  linux_x64_build:
    name: Linux x64
    needs: validation
    runs-on: "ubuntu-24.04"

    env:
      # FIXME: read this information from a property file
      # BOOT_JDK_VERSION: "${{ fromJson(needs.prerequisites.outputs.dependencies).BOOT_JDK_VERSION }}"
      # BOOT_JDK_FILENAME: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_FILENAME }}"
      # BOOT_JDK_URL: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_URL }}"
      # BOOT_JDK_SHA256: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_SHA256 }}"
      BOOT_JDK_VERSION: "25.0.1"
      BOOT_JDK_FILENAME: "jdk-25.0.1_linux-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/25/archive/jdk-25.0.1_linux-x64_bin.tar.gz"
      # ANT_DIR: "apache-ant-1.10.5"
      # ANT_FILENAME: "apache-ant-1.10.5.tar.gz"
      # ANT_URL: "https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.5-bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          path: jfx

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install ant libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev pkg-config libgtk2.0-dev libgtk-3-dev libxtst-dev gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          mkdir -p "${HOME}/build-tools"
          # wget -O "${HOME}/build-tools/${ANT_FILENAME}" "${ANT_URL}"
          # tar -zxf "${HOME}/build-tools/${ANT_FILENAME}" -C "${HOME}/build-tools"

# FIXME: enable cache for boot JDK
#      - name: Restore boot JDK from cache
#        id: bootjdk
#        uses: actions/cache@v4
#        with:
#          path: ~/bootjdk/${{ env.BOOT_JDK_VERSION }}
#          key: bootjdk-${{ runner.os }}-${{ env.BOOT_JDK_VERSION }}-${{ env.BOOT_JDK_SHA256 }}-v1

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          # FIXME: sha256sum
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"
          # FIXME: enable cache for boot JDK

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          # export ANT_HOME="${HOME}/build-tools/${ANT_DIR}"
          # echo "ANT_HOME=${ANT_HOME}" >> "${GITHUB_ENV}"
          # export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          which ant
          ant -version
          gcc -v

      - name: Build JavaFX artifacts
        working-directory: jfx
        run: |
          set -x
          # export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew -version
          bash gradlew --info all -x test

      - name: Run JavaFX headless tests
        if: false # disabled to speed up builds
        working-directory: jfx
        run: |
          set -x
          # export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew --info --continue -PTEST_ONLY=true test -x :web:test

      - name: Publish common and Linux artifacts to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-devmate')
        working-directory: jfx
        env:
          REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
          REPOSITORY_USERNAME: ${{ github.actor }}
          REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Linux publishes both common and platform-specific artifacts
          bash gradlew publish \
            -PrepositoryUrl="${REPOSITORY_URL}" \
            -PrepositoryUsername="${REPOSITORY_USERNAME}" \
            -PrepositoryPassword="${REPOSITORY_PASSWORD}" \
            -PPUBLISH_COMMON_ARTIFACTS=true

  macos_x64_build:
    if: false #disable macOS x64 build
    name: macOS x64
    needs: validation
    runs-on: "macos-15-intel"

    env:
      # FIXME: read this information from a property file
      # BOOT_JDK_VERSION: "${{ fromJson(needs.prerequisites.outputs.dependencies).BOOT_JDK_VERSION }}"
      # BOOT_JDK_FILENAME: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_FILENAME }}"
      # BOOT_JDK_URL: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_URL }}"
      # BOOT_JDK_SHA256: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_SHA256 }}"
      BOOT_JDK_VERSION: "25.0.1"
      BOOT_JDK_FILENAME: "jdk-25.0.1_macos-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/25/archive/jdk-25.0.1_macos-x64_bin.tar.gz"
      # Disabled due to timeout downloading ant; use ant installed on system
      #ANT_DIR: "apache-ant-1.10.5"
      #ANT_FILENAME: "apache-ant-1.10.5.tar.gz"
      #ANT_URL: "https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.5-bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          path: jfx

      - name: Install dependencies
        run: |
          set -x
          echo "NOT NEEDED: brew install make"
          echo "NOT NEEDED: wget ... ant"
          #mkdir -p "${HOME}/build-tools"
          #wget -O "${HOME}/build-tools/${ANT_FILENAME}" "${ANT_URL}"
          #tar -zxf "${HOME}/build-tools/${ANT_FILENAME}" -C "${HOME}/build-tools"

# FIXME: enable cache for boot JDK
#      - name: Restore boot JDK from cache
#        id: bootjdk
#        uses: actions/cache@v4
#        with:
#          path: ~/bootjdk/${{ env.BOOT_JDK_VERSION }}
#          key: bootjdk-${{ runner.os }}-${{ env.BOOT_JDK_VERSION }}-${{ env.BOOT_JDK_SHA256 }}-v1

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          # FIXME: sha256sum
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"
          # FIXME: enable cache for boot JDK

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          #export ANT_HOME="${HOME}/build-tools/${ANT_DIR}"
          #echo "ANT_HOME=${ANT_HOME}" >> "${GITHUB_ENV}"
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          which ant
          ant -version
          # Production builds use Xcode 15.4, but 16.0 is the lowest that the GHA macOS 15 runner supports
          sudo xcode-select --switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      - name: Build JavaFX artifacts
        working-directory: jfx
        run: |
          set -x
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew -version
          bash gradlew --info all

      - name: Run JavaFX headless tests
        working-directory: jfx
        run: |
          set -x
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew --info --continue -PTEST_ONLY=true test -x :web:test


  macos_aarch64_build:
    name: macOS aarch64
    needs: windows_x64_build
    runs-on: "macos-14"

    env:
      # FIXME: read this information from a property file
      # BOOT_JDK_VERSION: "${{ fromJson(needs.prerequisites.outputs.dependencies).BOOT_JDK_VERSION }}"
      # BOOT_JDK_FILENAME: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_FILENAME }}"
      # BOOT_JDK_URL: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_URL }}"
      # BOOT_JDK_SHA256: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_SHA256 }}"
      BOOT_JDK_VERSION: "25.0.1"
      BOOT_JDK_FILENAME: "jdk-25.0.1_macos-aarch64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/25/archive/jdk-25.0.1_macos-aarch64_bin.tar.gz"
      # Disabled due to timeout downloading ant; use ant installed on system
      #ANT_DIR: "apache-ant-1.10.5"
      #ANT_FILENAME: "apache-ant-1.10.5.tar.gz"
      #ANT_URL: "https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.5-bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          path: jfx

      - name: Install dependencies
        run: |
          set -x
          echo "NOT NEEDED: brew install make"
          echo "NOT NEEDED: wget ... ant"
          #mkdir -p "${HOME}/build-tools"
          #wget -O "${HOME}/build-tools/${ANT_FILENAME}" "${ANT_URL}"
          #tar -zxf "${HOME}/build-tools/${ANT_FILENAME}" -C "${HOME}/build-tools"

# FIXME: enable cache for boot JDK
#      - name: Restore boot JDK from cache
#        id: bootjdk
#        uses: actions/cache@v4
#        with:
#          path: ~/bootjdk/${{ env.BOOT_JDK_VERSION }}
#          key: bootjdk-${{ runner.os }}-${{ env.BOOT_JDK_VERSION }}-${{ env.BOOT_JDK_SHA256 }}-v1

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          # FIXME: sha256sum
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"
          # FIXME: enable cache for boot JDK

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          #export ANT_HOME="${HOME}/build-tools/${ANT_DIR}"
          #echo "ANT_HOME=${ANT_HOME}" >> "${GITHUB_ENV}"
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          which ant
          ant -version
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build JavaFX artifacts
        working-directory: jfx
        run: |
          set -x
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew -version
          bash gradlew --info all -x test

      - name: Run JavaFX headless tests
        if: false # turned off for speed
        working-directory: jfx
        run: |
          set -x
          #export PATH="$JAVA_HOME/bin:$ANT_HOME/bin:$PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew --info --continue -PTEST_ONLY=true test -x :web:test

      - name: Publish macOS aarch64 artifacts to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-devmate')
        working-directory: jfx
        env:
          REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
          REPOSITORY_USERNAME: ${{ github.actor }}
          REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"

          # Extract Maven coordinates from Gradle
          MAVEN_GROUP_ID=$(bash gradlew -q properties | grep "^MAVEN_GROUP_ID:" | awk '{print $2}' | head -n 1)
          MAVEN_VERSION=$(bash gradlew -q properties | grep "^MAVEN_VERSION:" | awk '{print $2}' | head -n 1)

          echo "MAVEN_GROUP_ID: $MAVEN_GROUP_ID"
          echo "MAVEN_VERSION: $MAVEN_VERSION"

          # Create Maven settings.xml with GitHub authentication
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${REPOSITORY_USERNAME}</username>
                <password>${REPOSITORY_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          # Publish only platform-specific JARs using deploy:deploy-file
          # This adds JARs to the existing publication created by Linux
          for jar in build/publications/*.jar; do
            if [[ "$jar" == *"-mac.jar" ]]; then
              # Extract metadata from the jar path
              module_name=$(basename "$(dirname "$jar")")
              jar_name=$(basename "$jar" .jar)
              artifact_id="${jar_name%-mac}"
              artifact_id="${artifact_id//./-}"

              echo "Deploying $jar as $artifact_id in group $MAVEN_GROUP_ID with classifier mac-aarch64"

              mvn deploy:deploy-file \
                -DgroupId="$MAVEN_GROUP_ID" \
                -DartifactId="$artifact_id" \
                -Dversion="$MAVEN_VERSION" \
                -Dclassifier="mac-aarch64" \
                -Dpackaging=jar \
                -Dfile="$jar" \
                -DrepositoryId=github \
                -Durl="${REPOSITORY_URL}" \
                -DgeneratePom=false
            fi
          done


  windows_x64_build:
    name: Windows x64
    needs: linux_x64_build
    runs-on: "windows-2022"

    env:
      # FIXME: read this information from a property file
      # BOOT_JDK_VERSION: "${{ fromJson(needs.prerequisites.outputs.dependencies).BOOT_JDK_VERSION }}"
      # BOOT_JDK_FILENAME: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_FILENAME }}"
      # BOOT_JDK_URL: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_URL }}"
      # BOOT_JDK_SHA256: "${{ fromJson(needs.prerequisites.outputs.dependencies).LINUX_X64_BOOT_JDK_SHA256 }}"
      BOOT_JDK_VERSION: "25.0.1"
      BOOT_JDK_FILENAME: "jdk-25.0.1_windows-x64_bin.zip"
      BOOT_JDK_URL: "https://download.oracle.com/java/25/archive/jdk-25.0.1_windows-x64_bin.zip"
      ANT_DIR: "apache-ant-1.10.5"
      ANT_FILENAME: "apache-ant-1.10.5.tar.gz"
      ANT_URL: "https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.5-bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          path: jfx

# FIXME: enable cache for boot JDK
#      - name: Restore boot JDK from cache
#        id: bootjdk
#        uses: actions/cache@v4
#        with:
#          path: ~/bootjdk/${{ env.BOOT_JDK_VERSION }}
#          key: bootjdk-${{ runner.os }}-${{ env.BOOT_JDK_VERSION }}-${{ env.BOOT_JDK_SHA256 }}-v1

      - name: Download boot JDK
        run: |
          mkdir -p "$HOME\bootjdk"
          & curl -L "$env:BOOT_JDK_URL" -o "$HOME/bootjdk/$env:BOOT_JDK_FILENAME"
          # FIXME: sha256sum
          tar -xf "$HOME/bootjdk/$env:BOOT_JDK_FILENAME" -C "$HOME/bootjdk"
          # FIXME: enable cache for boot JDK

      - name: Restore cygwin packages from cache
        id: cygwin
        uses: actions/cache@v4
        with:
          path: ~/cygwin/packages
          key: cygwin-packages-${{ runner.os }}-v1

      - name: Install cygwin
        run: |
          New-Item -Force -ItemType directory -Path "$HOME\cygwin"
          & curl -L "https://www.cygwin.com/setup-x86_64.exe" -o "$HOME/cygwin/setup-x86_64.exe"
          Start-Process -FilePath "$HOME\cygwin\setup-x86_64.exe" -ArgumentList "--quiet-mode --packages make,zip,unzip --root $HOME\cygwin\cygwin64 --local-package-dir $HOME\cygwin\packages --site http://mirrors.kernel.org/sourceware/cygwin --no-desktop --no-shortcuts --no-startmenu --no-admin" -Wait -NoNewWindow

      - name: Install dependencies
        run: |
          mkdir -p "$HOME\build-tools"
          & curl -L "$env:ANT_URL" -o "$HOME/build-tools/$env:ANT_FILENAME"
          tar -zxf "$HOME/build-tools/$env:ANT_FILENAME" -C "$HOME/build-tools"

      - name: Setup environment
        run: |
          echo "dir ...\VC\Tools\MSVC"
          dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          # echo "dir ...\VC\Tools\MSVC"
          # dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"

          $env:Path = "$HOME\cygwin\cygwin64\bin;$HOME\cygwin\cygwin64\bin;$env:Path" ;
          $env:JAVA_HOME = "$HOME\bootjdk\jdk-$env:BOOT_JDK_VERSION" ;
          echo "JAVA_HOME=$env:JAVA_HOME"
          $env:ANT_HOME = "${HOME}\build-tools\$env:ANT_DIR"
          echo "ANT_HOME=$env:ANT_HOME"
          $env:Path = "$env:JAVA_HOME\bin;$env:ANT_HOME\bin;$env:Path" ;
          echo "Path=$env:Path"
          which java
          java -version
          which ant
          ant -version

          # Save JAVA_HOME, ANT_HOME, and Path (renamed to THE_PATH) in env variables
          echo "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ANT_HOME=$env:ANT_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "THE_PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JavaFX artifacts
        working-directory: jfx
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME"
          echo "ANT_HOME=$env:ANT_HOME"
          $env:Path = "$env:THE_PATH" ;
          echo "Path=$env:Path"
          which java
          java -version
          .\gradlew.bat -version
          # Skip "chmod" task for GHA builds. See JDK-8354337 for details.
          .\gradlew.bat --info -PCHMOD_ARTIFACTS=false all -x test

      - name: Run JavaFX headless tests
        if: false # turned off for speed
        working-directory: jfx
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME"
          echo "ANT_HOME=$env:ANT_HOME"
          $env:Path = "$env:THE_PATH" ;
          echo "Path=$env:Path"
          .\gradlew.bat --info --continue -PTEST_ONLY=true test -x :web:test

      - name: Publish Windows artifacts to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-devmate')
        working-directory: jfx
        env:
          REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
          REPOSITORY_USERNAME: ${{ github.actor }}
          REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:Path = "$env:THE_PATH"
          $gradleProps = .\gradlew.bat -q properties
          $groupLine = ($gradleProps | Select-String "^MAVEN_GROUP_ID:" | Select-Object -First 1).Line
          $versionLine = ($gradleProps | Select-String "^MAVEN_VERSION:" | Select-Object -First 1).Line
          $MAVEN_GROUP_ID = ($groupLine -replace "^MAVEN_GROUP_ID:\s*", "").Trim()
          $MAVEN_VERSION = ($versionLine -replace "^MAVEN_VERSION:\s*", "").Trim()
          Write-Host "MAVEN_GROUP_ID: $MAVEN_GROUP_ID"
          Write-Host "MAVEN_VERSION: $MAVEN_VERSION"
          $m2Dir = "$HOME\.m2"
          New-Item -ItemType Directory -Force -Path $m2Dir | Out-Null
          @"
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$env:REPOSITORY_USERNAME</username>
                <password>$env:REPOSITORY_PASSWORD</password>
              </server>
            </servers>
          </settings>
          "@ | Out-File -FilePath "$m2Dir\settings.xml" -Encoding utf8
          Get-ChildItem -Path "build\publications" -Filter "*-win.jar" -Recurse | ForEach-Object {
            $jar = $_.FullName
            $jarName = $_.BaseName
            $artifactId = $jarName -replace '-win$', '' -replace '\.', '-'
            mvn deploy:deploy-file `
              "-DgroupId=$MAVEN_GROUP_ID" `
              "-DartifactId=$artifactId" `
              "-Dversion=$MAVEN_VERSION" `
              "-Dclassifier=win" `
              "-Dpackaging=jar" `
              "-Dfile=$jar" `
              "-DrepositoryId=github" `
              "-Durl=$env:REPOSITORY_URL" `
              "-DgeneratePom=false"
          }
